name: Live Profile Stats Updater

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Live Stats & Update Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          node scripts/update-stats.mjs

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(stats): live auto-update profile statistics [skip ci]"
            git push
          fi
