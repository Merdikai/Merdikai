<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #16a37c; }
    .lang-name { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .lang-pct { font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="494" height="194" rx="8" fill="#0d1117" stroke="#16a37c" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="8" fill="url(#grad3)" fill-opacity="0.15"/>

  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a37c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <g transform="translate(25, 30)">
    <text x="0" y="14" class="header">Most Used Languages</text>
  </g>

  <!-- Multi-segment Progress Bar -->
  <g transform="translate(25, 60)">
    <rect x="0" y="0" width="445" height="10" rx="5" fill="#21262d"/>
    <!-- Python (54%) -->
    <rect x="0" y="0" width="241" height="10" rx="5" fill="#3572A5"/>
    <!-- C# (19%) -->
    <rect x="243" y="0" width="84" height="10" rx="0" fill="#178600"/>
    <!-- TypeScript (17%) -->
    <rect x="329" y="0" width="76" height="10" rx="0" fill="#3178c6"/>
    <!-- JavaScript (9%) -->
    <rect x="407" y="0" width="38" height="10" rx="5" fill="#f1e05a"/>
  </g>

  <!-- Language Grid -->
  <g transform="translate(25, 95)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3572A5"/>
      <text x="18" y="10" class="lang-name">Python</text>
      <text x="135" y="10" class="lang-pct">54.2%</text>
    </g>

    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="5" fill="#178600"/>
      <text x="18" y="10" class="lang-name">C# (.NET)</text>
      <text x="135" y="10" class="lang-pct">18.7%</text>
    </g>

    <g transform="translate(0, 64)">
      <circle cx="6" cy="6" r="5" fill="#3178c6"/>
      <text x="18" y="10" class="lang-name">TypeScript</text>
      <text x="135" y="10" class="lang-pct">17.3%</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(240, 0)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
      <text x="18" y="10" class="lang-name">JavaScript</text>
      <text x="135" y="10" class="lang-pct">9.1%</text>
    </g>

    <g transform="translate(240, 32)">
      <circle cx="6" cy="6" r="5" fill="#00B4AB"/>
      <text x="18" y="10" class="lang-name">Dart / Flutter</text>
      <text x="135" y="10" class="lang-pct">Mobile</text>
    </g>

    <g transform="translate(240, 64)">
      <circle cx="6" cy="6" r="5" fill="#16a37c"/>
      <text x="18" y="10" class="lang-name">SQL / EF Core</text>
      <text x="135" y="10" class="lang-pct">Database</text>
    </g>
  </g>
</svg>
