<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #16a37c; }
    .badge { font: 500 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .desc { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .meta { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .icon { fill: #16a37c; }
    .star-icon { fill: #e3b341; }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="399" height="119" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Card Header -->
  <g transform="translate(18, 26)">
    <!-- Repo Book Icon -->
    <path class="icon" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z" transform="scale(0.85) translate(0, -12)"/>
    <text x="20" y="0" class="title">nail-booking-app</text>
    <!-- Public Pill -->
    <rect x="155" y="-12" width="46" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
    <text x="178" y="1" text-anchor="middle" class="badge">Public</text>
  </g>

  <!-- Description -->
  <g transform="translate(18, 48)">
    <text class="desc" x="0" y="0">
      <tspan x="0" dy="0">Modern beauty salon appointment booking platform</tspan>
      <tspan x="0" dy="16">with live calendar slot scheduling &amp; alerts.</tspan>
    </text>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(18, 98)">
    <!-- Primary Language -->
    <circle cx="5" cy="-4" r="5" fill="#3178c6"/>
    <text x="16" y="0" class="meta">TypeScript</text>

    <!-- Star Count -->
    <g transform="translate(95, 0)">
      <path class="star-icon" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z" transform="scale(0.75) translate(0, -14)"/>
      <text x="16" y="0" class="meta">1</text>
    </g>

    <!-- Tech Tag Pill -->
    <g transform="translate(140, -11)">
      <rect x="0" y="0" width="85" height="16" rx="4" fill="#16a37c" fill-opacity="0.12" stroke="#16a37c" stroke-opacity="0.3" stroke-width="0.8"/>
      <text x="42" y="11" text-anchor="middle" font-size="10" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-weight="600" fill="#16a37c">Next.js</text>
    </g>
  </g>
</svg>
