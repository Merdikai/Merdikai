<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #16a37c; }
    .stat-label { font: 500 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .stat-val { font: 700 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #16a37c; }
    .rank-sub { font: 600 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
