    <g transform="translate(0, 60)">
      <path class="icon" d="M7 1.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zm-5 7a2.5 2.5 0 100 5 2.5 2.5 0 000-5zm10 0a2.5 2.5 0 100 5 2.5 2.5 0 000-5z" transform="scale(0.9) translate(0, -2)"/>
      <text x="22" y="10" class="stat-label">Pull Requests Merged:</text>
      <text x="195" y="10" class="stat-val">19</text>
    </g>

