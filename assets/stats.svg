  <!-- Right Rank / Performance Badge -->
  <g transform="translate(380, 110)">
    <circle cx="0" cy="0" r="42" fill="#0d1117" stroke="#16a37c" stroke-width="3" stroke-dasharray="230" stroke-dashoffset="35"/>
    <circle cx="0" cy="0" r="34" fill="#16a37c" fill-opacity="0.1"/>
    <text x="0" y="6" text-anchor="middle" class="rank-text">A+</text>
    <text x="0" y="58" text-anchor="middle" class="rank-sub">TOP CONTRIBUTOR</text>
  </g>
